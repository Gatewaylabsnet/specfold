name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # electron-vite build only bundles; the Electron binary is not needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release checks
        run: npm run release:check

  packaged-e2e-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prefetch verified official packaging downloads
        timeout-minutes: 12
        run: |
          node --test scripts/prefetch-packaging-downloads.test.mjs
          node scripts/prefetch-packaging-downloads.mjs

      - name: Build Windows portable package
        run: npm run package:win:portable --workspace @openapi-collection-studio/desktop

      - name: Exercise packaged Electron workflows
        env:
          SPECFOLD_E2E_EXECUTABLE: dist/win-unpacked/Specfold.exe
        run: |
          npm run build --workspace @specfold/agent
          npm run test:e2e --workspace @openapi-collection-studio/desktop

      - name: Upload packaged E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: specfold-packaged-e2e-diagnostics
          path: |
            apps/desktop/e2e/artifacts
            apps/desktop/playwright-report
          if-no-files-found: ignore

  installer-upgrade-windows:
    name: Real Windows installer (${{ matrix.scope }})
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scope: [currentUser, allUsers]
    env:
      SPECFOLD_INSTALLER_QA: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test installer QA safety guards
        run: node --test scripts/installer-qa.test.mjs
      - name: Prefetch verified official packaging downloads
        timeout-minutes: 12
        run: |
          node --test scripts/prefetch-packaging-downloads.test.mjs
          node scripts/prefetch-packaging-downloads.mjs

      - name: Build candidate NSIS installer
        run: npm run package:win:installer
      - name: Verify real install, upgrade and snapshot rollback
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/verify-windows-installer.ps1 -CandidateInstaller "apps/desktop/dist/Specfold-$version-x64.exe" -Scope '${{ matrix.scope }}'
      - name: Upload installer verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-qa-${{ matrix.scope }}
          path: installer-qa-${{ matrix.scope }}.json
          if-no-files-found: warn
